<!DOCTYPE html>
<html style="color-scheme: light;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>damage exacter helper</title>
		<meta name="description" content="damage exacter helper for the pandora box's special challenge in hypixel skyblock">

		<link rel="icon" type="image/png" href="/resources/skyblock/pandoras_box.png">
		<link rel="stylesheet" href="/css/main.css">
		<style>
			:root{
			--bg:#0e1014; --panel:#161a21; --panel-2:#1c2129; --line:#272d38;
			--text:#e7e9ef; --muted:#8b93a5;
			--accent:#f0b429; --ok:#4ade80; --lock:#f87171;
			--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
			}
			*{box-sizing:border-box}
			body{
			margin:0;background:var(--bg);color:var(--text);
			font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
			padding:2rem 1rem 4rem;
			}
			.wrap{max-width:1080px;margin:0 auto}
			h1{font-size:1.05rem;margin:0 0 .2rem}
			header p{margin:0 0 1.5rem;color:var(--muted);font-size:.85rem}
			
			.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:1.5rem;align-items:start}
			@media (max-width:900px){.layout{grid-template-columns:1fr;gap:1rem}}
			
			/* ---------- inputs ---------- */
			.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.4rem}
			.row{
			display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;
			padding:.5rem .8rem;border-radius:10px;
			}
			.row + .row{box-shadow:inset 0 1px 0 var(--line)}
			.row:hover{background:var(--panel-2)}
			.row label{font-size:.9rem;color:var(--muted);line-height:1.3}
			.row.filled label{color:var(--text)}
			.field{display:flex;align-items:center;gap:.5rem}
			input{
			width:clamp(88px,26vw,130px);padding:.5rem .5rem;text-align:center;
			background:var(--bg);color:var(--text);
			border:1px solid var(--line);border-radius:8px;
			font-family:var(--mono);font-size:16px;letter-spacing:.1em;
			transition:border-color .15s,box-shadow .15s;
			}
			input::placeholder{color:#4a5163;letter-spacing:.1em}
			input:focus{
			outline:none;border-color:var(--accent);
			box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);
			}
			.row.filled input{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
			
			.hint{
			width:24px;height:24px;flex:none;display:grid;place-items:center;
			border-radius:50%;border:1px solid var(--line);background:var(--bg);
			color:var(--muted);font-size:.72rem;font-weight:700;cursor:help;
			transition:.15s;padding:0;
			}
			.hint:hover,.hint:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
			
			/* ---------- preview ---------- */
			.preview{
			position:sticky;top:1rem;background:var(--panel);
			border:1px solid var(--line);border-radius:14px;overflow:hidden;
			}
			.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0c10}
			.preview.empty img{opacity:.15}
			.preview .cap{padding:.65rem .85rem;font-size:.8rem;color:var(--muted);line-height:1.45}
			.preview .cap b{display:block;color:var(--text);font-weight:500;margin-bottom:.15rem}
			.pclose{
				display:none;position:absolute;top:.5rem;right:.5rem;z-index:2;
				width:32px;height:32px;border-radius:50%;place-items:center;
				background:#000b;border:1px solid var(--line);color:var(--text);
				font-size:.85rem;cursor:pointer;
			}
			.backdrop{display:none}
			
			/* ---------- results ---------- */
			.results{margin-top:1.75rem}
			.results h2{
			display:flex;justify-content:space-between;align-items:baseline;
			font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;
			color:var(--muted);margin:0 0 .55rem;font-weight:600;
			}
			.results h2 span{letter-spacing:.05em;font-weight:400;color:#5d6473}
			.unlocks{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .9rem}
			.chip{
			border:1px solid var(--line);background:var(--panel);color:var(--muted);
			border-radius:999px;padding:.28rem .7rem;font-size:.76rem;cursor:pointer;
			transition:.15s;
			}
			.chip[aria-pressed="true"]{
			background:color-mix(in srgb,var(--accent) 16%,transparent);
			border-color:var(--accent);color:var(--accent);
			}
			
			.sols{display:flex;flex-direction:column;gap:1px;background:var(--line);
				border:1px solid var(--line);border-radius:12px;overflow:hidden}
			.sol{
			display:flex;align-items:center;gap:.7rem;width:100%;
			padding:.6rem .85rem;background:var(--panel);
			border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
			transition:background .15s,opacity .2s,filter .2s;
			}
			.sol:hover{background:var(--panel-2)}
			.sol .nums{font-family:var(--mono);font-size:1rem;letter-spacing:.16em;flex:1;min-width:0}
			.sol .reqs{display:flex;flex-wrap:wrap;gap:.25rem;justify-content:flex-end}
			.sol .tag{
			font-size:.65rem;padding:.08rem .42rem;border-radius:999px;white-space:nowrap;
			background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
			}
			.sol .copy-hint{
			font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
			color:#5d6473;flex:none;transition:color .15s;
			}
			.sol:hover .copy-hint{color:var(--accent)}
			.sol.locked{opacity:.42;filter:saturate(.25)}
			.sol.locked .tag{border-color:color-mix(in srgb,var(--lock) 55%,var(--line));color:var(--lock)}
			
			/* ---------- mobile ---------- */
			@media (max-width:900px){
			.preview{
				position:fixed;left:.75rem;right:.75rem;bottom:.75rem;z-index:60;
				display:none;box-shadow:0 24px 60px #000c;
			}
			.preview.open{display:block}
			.pclose{display:grid}
			.backdrop.show{
				display:block;position:fixed;inset:0;z-index:50;
				background:#000a;backdrop-filter:blur(2px);
			}
			}
			@media (max-width:600px){
			body{padding:1.25rem .7rem 2.5rem}
			.row{padding:.45rem .6rem;gap:.5rem}
			.row label{font-size:.85rem}
			.hint{width:30px;height:30px;font-size:.78rem}
			.sol{padding:.55rem .7rem;gap:.5rem}
			.sol .nums{font-size:.92rem;letter-spacing:.12em}
			.sol .copy-hint{display:none}
			.results{margin-top:1.4rem}
			}
			</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<h1>Challenge Solver</h1>
				<p>Fill in each value. Tap <b>?</b> for where to find it.</p>
			</header>
		
			<div class="layout">
				<div class="panel">
					<div class="row">
						<label for="f1">Wall code</label>
						<div class="field">
							<button class="hint" data-title="Wall code"
									data-desc="Second floor, plaque beside the elevator."
									data-img="shots/wall.webp" aria-label="Show wall code">?</button>
							<input id="f1" placeholder="0000" maxlength="4" inputmode="numeric">
						</div>
					</div>
					<div class="row">
					<label for="f2">Red lamps</label>
					<div class="field">
						<button class="hint" data-title="Red lamps"
								data-desc="Catwalk above the turbine hall — count only the lit ones."
								data-img="shots/lamps.webp" aria-label="Show red lamps">?</button>
						<input id="f2" placeholder="00" maxlength="2" inputmode="numeric">
					</div>
					</div>
					<div class="row">
					<label for="f3">Date on plaque</label>
					<div class="field">
						<button class="hint" data-title="Plaque date"
								data-desc="Lobby, under the portrait."
								data-img="shots/plaque.webp" aria-label="Show plaque">?</button>
						<input id="f3" placeholder="MMDD" maxlength="4" inputmode="numeric">
					</div>
					</div>
				</div>
			
				<aside class="preview empty" id="preview" aria-live="polite">
					<button class="pclose" id="pclose" aria-label="Close preview">✕</button>
					<img src="" alt="">
					<div class="cap"><b>Nothing selected</b>Hover a <b>?</b> to see the spot.</div>
				</aside>
			</div>
		
			<section class="results">
			<h2>Your unlocks</h2>
			<div class="unlocks">
				<button class="chip" data-unlock="redkey"  aria-pressed="false">Red Key</button>
				<button class="chip" data-unlock="grapple" aria-pressed="false">Grapple</button>
				<button class="chip" data-unlock="crowbar" aria-pressed="false">Crowbar</button>
			</div>
		
			<h2>Solutions <span id="cnt"></span></h2>
			<div class="sols">
				<button class="sol" data-text="48152" data-req="">
				<span class="nums">4 8 1 5 2</span>
				<span class="reqs"></span>
				<span class="copy-hint">copy</span>
				</button>
				<button class="sol" data-text="48159" data-req="redkey">
				<span class="nums">4 8 1 5 9</span>
				<span class="reqs"><span class="tag">Red Key</span></span>
				<span class="copy-hint">copy</span>
				</button>
				<button class="sol" data-text="72044" data-req="grapple crowbar">
				<span class="nums">7 2 0 4 4</span>
				<span class="reqs"><span class="tag">Grapple</span><span class="tag">Crowbar</span></span>
				<span class="copy-hint">copy</span>
				</button>
			</div>
			</section>
		</div>
		
		<div class="backdrop" id="backdrop"></div>
		
		<script>
			const preview  = document.getElementById('preview');
			const backdrop = document.getElementById('backdrop');
			const pimg     = preview.querySelector('img');
			const pcap     = preview.querySelector('.cap');
			const narrow   = () => matchMedia('(max-width:900px)').matches;
			
			function showPreview(h){
				pimg.src = h.dataset.img;
				pimg.alt = h.dataset.title;
				pcap.innerHTML = `<b>${h.dataset.title}</b>${h.dataset.desc}`;
				preview.classList.remove('empty');
				preview.classList.add('open');
				if (narrow()) backdrop.classList.add('show');
			}
			function hidePreview(){
				preview.classList.remove('open');
				backdrop.classList.remove('show');
			}
			
			document.querySelectorAll('.hint').forEach(h => {
				h.addEventListener('mouseenter', () => { if (!narrow()) showPreview(h); });
				h.addEventListener('focus',      () => { if (!narrow()) showPreview(h); });
				h.addEventListener('click', e => { e.preventDefault(); showPreview(h); });
			});
			
			document.getElementById('pclose').addEventListener('click', hidePreview);
			backdrop.addEventListener('click', hidePreview);
			addEventListener('keydown', e => { if (e.key === 'Escape') hidePreview(); });
			
			/* unlocks */
			const owned = new Set();
			document.querySelectorAll('.chip').forEach(c => {
				c.addEventListener('click', () => {
				const k = c.dataset.unlock;
				owned.has(k) ? owned.delete(k) : owned.add(k);
				c.setAttribute('aria-pressed', owned.has(k));
				render();
				});
			});
			
			const cnt = document.getElementById('cnt');
			function render(){
				const sols = [...document.querySelectorAll('.sol')];
				let open = 0;
				sols.forEach(s => {
				const ok = (s.dataset.req || '').split(' ').filter(Boolean).every(k => owned.has(k));
				s.classList.toggle('locked', !ok);
				if (ok) open++;
				});
				cnt.textContent = `${open} of ${sols.length}`;
			}
			render();
			
			/* copy */
			document.querySelectorAll('.sol').forEach(b => {
				b.addEventListener('click', () => {
				navigator.clipboard.writeText(b.dataset.text);
				const h = b.querySelector('.copy-hint');
				h.textContent = 'copied';
				h.style.color = 'var(--ok)';
				setTimeout(() => { h.textContent = 'copy'; h.style.color = ''; }, 1100);
				});
			});
			
			/* filled state */
			document.querySelectorAll('.row input').forEach(i => {
				const upd = () => i.closest('.row').classList.toggle('filled', i.value.trim() !== '');
				i.addEventListener('input', upd); upd();
			});
			</script>
		</body>
</html>
